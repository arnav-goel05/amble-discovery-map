name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_EXTERNAL_SERVICES: forbidden
  PLAYWRIGHT_GEOMETRY_FIXTURE: "1"
  TILE_FALLBACK_ORIGIN: ""

jobs:
  quality:
    name: Local quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify zero-external CI policy
        run: npm run ci:policy

      - name: Verify compact geometry fixture
        run: npm run geometry:fixture:verify && npm run geometry:fixture:prepare

      - name: Lint JavaScript
        run: npm run lint

      - name: Check full production-candidate formatting
        env:
          CI_HEAD_SHA: ${{ github.sha }}
        run: CI_BASE_SHA="$(git rev-parse origin/main)" npm run format:check

      - name: Run all unit and integration tests
        run: npm run test:unit

      - name: Verify event source contracts
        run: npm run test:event-sources

      - name: Verify voice action and capability parity
        run: npm run verify:voice-actions && npm run verify:voice-capabilities

      - name: Verify Cloudflare worker contracts without credentials
        run: npm run cloudflare:cloud:contracts

      - name: Build production-equivalent frontend without geometry hydration
        run: npm run build:ci

  complete:
    name: Quality checks
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require local quality
        run: |
          test "${{ needs.quality.result }}" = "success"
